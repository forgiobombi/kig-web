[package]
name = "kig-web"
version = "0.1.0"
authors = ["RoccoDev <hey@rocco.dev>"]
edition = "2018"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
# >= 3.2.5 includes a TLS certificate validation fix.
mongodb = { version = "3.2.5", default-features = false, features = ["rustls-tls", "bson-2", "compat-3-3-0"] }
serde = {version = "1", features = ["derive"]}
serde_json = "1"

# Gamelogs
protobuf = "3.7"
base62 = "0.3"
regex = "1"
lazy_static = "1"

# Web server
askama = "0.10"
askama_derive = "0.10"
actix-web = "4"
cached = { version = "0.56", features = ["async"] }
actix-files = "0.6"

# Misc
strum = "0.20"
strum_macros = "0.20"
time = { version = "0.3", features = ["local-offset"] }

[build-dependencies]
# Gamelog deserialization
protobuf-codegen = "3.7"
protobuf-parse = "3.7"
